name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - '.opencode/**'
      - '.github/dependabot.yml'
      - 'Mythos_SMP_Full_Project_Summary_Implementation_Plan.docx.txt'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - '.opencode/**'
      - '.github/dependabot.yml'
      - 'Mythos_SMP_Full_Project_Summary_Implementation_Plan.docx.txt'
      - 'LICENSE'

# Cancel in-progress builds if a new push arrives on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Run All Test Suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build & Run All Test Suites
        run: ./gradlew build integrationTest stressTest shadowJar
