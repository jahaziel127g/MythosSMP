name: MythosSMP
version: 1.5.1-alpha
main: com.mythossmp.MythosSMP
api-version: 1.21
author: MythosSMP Team
description: A revolutionary mythological SMP plugin with divine Vows and high-stakes trials

commands:
  vow:
    description: Manage your divine Vow
    usage: /<command> [info|list|accept]
    aliases: [vows]
  trust:
    description: Manage your trusted players list
    usage: /<command> [add|remove|list]
  ability1:
    description: Activate your first Vow ability
    usage: /<command>
    aliases: [a1, ab1]
  ability2:
    description: Activate your second Vow ability
    usage: /<command>
    aliases: [a2, ab2]
  union:
    description: Seal of Union management
    usage: /<command> [create|break|info]
    aliases: [unions]
  trial:
    description: Trial management commands
    usage: /<command> [start|info|leave|give]
    aliases: [trials]

permissions:
  mythossmp.ability:
    description: Allows use of Vow abilities
    default: true
