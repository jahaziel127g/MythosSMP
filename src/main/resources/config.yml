database:
  path: "plugins/MythosSMP/mythos_smp.db"
  pool-size: 4
  max-backups: 5

trials:
  ares:
    display-name: "Ares"
    vow-key: "ares"
    description: "Prove your worth to the God of War"
    time-limit-seconds: 600
    max-party-size: 4
    base-health: 60.0
    base-damage: 6.0
    waves:
      - wave-number: 1
        mobs:
          - type: ZOMBIE
            count: 4
          - type: SPIDER
            count: 2
      - wave-number: 2
        mobs:
          - type: SKELETON
            count: 4
          - type: CREEPER
            count: 2
      - wave-number: 3
        mobs:
          - type: VINDICATOR
            count: 3
          - type: EVOKER
            count: 1
  loki:
    display-name: "Loki"
    vow-key: "loki"
    description: "Outwit the God of Mischief"
    time-limit-seconds: 600
    max-party-size: 4
    base-health: 45.0
    base-damage: 5.0
    waves:
      - wave-number: 1
        mobs:
          - type: SPIDER
            count: 3
          - type: CREEPER
            count: 2
      - wave-number: 2
        mobs:
          - type: SKELETON
            count: 4
          - type: SPIDER
            count: 3
      - wave-number: 3
        mobs:
          - type: VEX
            count: 3
          - type: CREEPER
            count: 3
  hades:
    display-name: "Hades"
    vow-key: "hades"
    description: "Survive the depths of the Underworld"
    time-limit-seconds: 600
    max-party-size: 4
    base-health: 65.0
    base-damage: 6.5
    waves:
      - wave-number: 1
        mobs:
          - type: ZOMBIE
            count: 4
          - type: SKELETON
            count: 2
      - wave-number: 2
        mobs:
          - type: WITHER_SKELETON
            count: 3
          - type: SKELETON
            count: 3
      - wave-number: 3
        mobs:
          - type: BLAZE
            count: 2
          - type: WITHER_SKELETON
            count: 4

vows:
  zeus:
    enabled: true
    static-charge-per-block: 0.01
    conductive-multiplier: 1.2
    static-strike-damage: 5.0
  loki:
    enabled: true
    curse:
      health-reduction: 4.0
    passive:
      backstab-dot-threshold: 0.75
      backstab-multiplier: 2.5
    abilities:
      shadow-step:
        cooldown: 25
        range: 15.0
      veil-of-lies:
        cooldown: 45
        duration: 10.0
        first-hit-multiplier: 3.0
  hades:
    enabled: true
    curse:
      health-reduction: 4.0
    passive:
      max-charges: 5
      damage-bonus-per-charge: 0.1
    abilities:
      death-defiance:
        cooldown: 90
      soul-burst:
        cooldown: 30
        range: 8.0
        base-damage: 4.0
  poseidon:
    enabled: true
    ability1:
      cooldown-seconds: 35
      radius-blocks: 8.0
      push-velocity-factor: 1.4
    ability2:
      cooldown-seconds: 10
      strength-amp: 0
      regen-amp: 0
    curse:
      dehydration-limit-minutes: 5.0
      damage-amount: 1.0
      interval-seconds: 3.0
  hermes:
    enabled: true
    passive:
      double-jump-cooldown-ticks: 300
    ability1:
      cooldown-seconds: 6
      dash-distance: 12.0
    ability2:
      cooldown-seconds: 150
      duration-seconds: 8.0
    curse:
      max-armor-tier: "CHAINMAIL"
      rejection-damage: 4.0

debug: false
